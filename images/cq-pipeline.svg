<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a5566"/></marker>
    <marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c96b62"/></marker>
  </defs>
  <rect width="1100" height="300" fill="#faf7f2"/>
  <g font-size="14" fill="#3d3a4a" text-anchor="middle">
    <rect x="60" y="90" width="150" height="60" rx="10" fill="#e4dcf1" stroke="#3d3a4a" stroke-opacity="0.2"/>
    <text x="135" y="117">prompt change</text>
    <text x="135" y="137" font-size="12" fill="#6b6577">a PR, like code</text>

    <rect x="270" y="90" width="170" height="60" rx="10" fill="#f9dcc4" stroke="#3d3a4a" stroke-opacity="0.2"/>
    <text x="355" y="117">replay golden set</text>
    <text x="355" y="137" font-size="12" fill="#6b6577">real prompt code, real model</text>

    <rect x="500" y="90" width="170" height="60" rx="10" fill="#f9dcc4" stroke="#3d3a4a" stroke-opacity="0.2"/>
    <text x="585" y="117">score every layer</text>
    <text x="585" y="137" font-size="12" fill="#6b6577">signals, decisions, judge</text>

    <rect x="730" y="90" width="150" height="60" rx="10" fill="#efeae3" stroke="#3d3a4a" stroke-opacity="0.2"/>
    <text x="805" y="117">gates</text>
    <text x="805" y="137" font-size="12" fill="#6b6577">one per metric, all pass</text>

    <rect x="940" y="70" width="110" height="44" rx="10" fill="#e4dcf1" stroke="#3d3a4a" stroke-opacity="0.2"/>
    <text x="995" y="97">merge</text>
    <rect x="940" y="136" width="110" height="44" rx="10" fill="#efeae3" stroke="#c96b62" stroke-width="2"/>
    <text x="995" y="163" fill="#c96b62">blocked</text>
  </g>
  <line x1="210" y1="120" x2="265" y2="120" stroke="#5a5566" stroke-width="2" marker-end="url(#pa)"/>
  <line x1="440" y1="120" x2="495" y2="120" stroke="#5a5566" stroke-width="2" marker-end="url(#pa)"/>
  <line x1="670" y1="120" x2="725" y2="120" stroke="#5a5566" stroke-width="2" marker-end="url(#pa)"/>
  <line x1="880" y1="110" x2="935" y2="94" stroke="#5a5566" stroke-width="2" marker-end="url(#pa)"/>
  <line x1="880" y1="130" x2="935" y2="156" stroke="#c96b62" stroke-width="2" marker-end="url(#pr)"/>
  <!-- pinned inputs -->
  <rect x="255" y="200" width="200" height="40" rx="8" fill="#faf7f2" stroke="#5a5566" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="355" y="225" text-anchor="middle" font-size="12" fill="#6b6577">golden set, pinned by checksum</text>
  <line x1="355" y1="200" x2="355" y2="155" stroke="#5a5566" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#pa)"/>
  <rect x="500" y="200" width="170" height="40" rx="8" fill="#faf7f2" stroke="#5a5566" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="585" y="225" text-anchor="middle" font-size="12" fill="#6b6577">rules, versioned</text>
  <line x1="585" y1="200" x2="585" y2="155" stroke="#5a5566" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#pa)"/>
  <text x="550" y="278" text-anchor="middle" font-size="13" fill="#6b6577">the inputs are pinned, so a change in the number means a change in the agent</text>
</svg>
