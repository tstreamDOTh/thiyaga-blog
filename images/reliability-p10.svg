<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="p10a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5566"/>
    </marker>
  </defs>
  <rect width="1100" height="360" fill="#faf7f2"/>

  <!-- counter chips -->
  <g fill="#e4dcf1" stroke="#3d3a4a" stroke-opacity="0.2">
    <rect x="80" y="60"  width="200" height="40" rx="20"/>
    <rect x="80" y="112" width="200" height="40" rx="20"/>
    <rect x="80" y="164" width="200" height="40" rx="20"/>
    <rect x="80" y="216" width="200" height="40" rx="20"/>
  </g>
  <g font-size="13" fill="#3d3a4a">
    <text x="180" y="85"  text-anchor="middle">recording started / stopped</text>
    <text x="180" y="137" text-anchor="middle">uploads, webhooks</text>
    <text x="180" y="189" text-anchor="middle">fallback activations</text>
    <text x="180" y="241" text-anchor="middle">recovery attempts</text>
  </g>
  <text x="80" y="290" font-size="13" fill="#8a8494">counters kept in memory: agents are</text>
  <text x="80" y="308" font-size="13" fill="#8a8494">too short-lived for a live metrics pipe</text>

  <g stroke="#5a5566" stroke-width="2">
    <line x1="280" y1="80"  x2="420" y2="150" marker-end="url(#p10a)"/>
    <line x1="280" y1="132" x2="420" y2="156" marker-end="url(#p10a)"/>
    <line x1="280" y1="184" x2="420" y2="162" marker-end="url(#p10a)"/>
    <line x1="280" y1="236" x2="420" y2="170" marker-end="url(#p10a)"/>
  </g>

  <!-- webhook -->
  <rect x="425" y="120" width="220" height="80" rx="14" fill="#d6e4f0" stroke="#3d3a4a" stroke-opacity="0.25"/>
  <text x="535" y="155" text-anchor="middle" font-size="15" font-weight="600" fill="#3d3a4a">post-call webhook</text>
  <text x="535" y="178" text-anchor="middle" font-size="12" fill="#6b6577">works only if shutdown works</text>

  <line x1="645" y1="160" x2="740" y2="160" stroke="#5a5566" stroke-width="2" marker-end="url(#p10a)"/>

  <!-- alarm -->
  <rect x="745" y="110" width="280" height="100" rx="14" fill="#dce8df" stroke="#3d3a4a" stroke-opacity="0.25"/>
  <text x="885" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#3d3a4a">alarm on degraded calls</text>
  <text x="885" y="170" text-anchor="middle" font-size="13" fill="#6b6577">3 recovered errors in one call,</text>
  <text x="885" y="190" text-anchor="middle" font-size="13" fill="#6b6577">not raw exception counts</text>

  <text x="425" y="290" font-size="14" font-weight="600" fill="#c96b62">attribute before you fix:</text>
  <text x="425" y="312" font-size="14" fill="#3d3a4a">we spent a week hunting a frontend bug that was a deploy drain</text>
</svg>
