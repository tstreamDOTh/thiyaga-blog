<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="1100" height="360" fill="#faf7f2"/>

  <line x1="80" y1="180" x2="1020" y2="180" stroke="#3d3a4a" stroke-width="4"/>

  <!-- throttled ticks -->
  <g stroke="#8f86c9" stroke-width="2.5">
    <line x1="150" y1="160" x2="150" y2="200"/>
    <line x1="230" y1="160" x2="230" y2="200"/>
    <line x1="310" y1="160" x2="310" y2="200"/>
    <line x1="470" y1="160" x2="470" y2="200"/>
    <line x1="550" y1="160" x2="550" y2="200"/>
    <line x1="710" y1="160" x2="710" y2="200"/>
    <line x1="790" y1="160" x2="790" y2="200"/>
  </g>
  <text x="150" y="140" font-size="13" fill="#8f86c9" font-weight="600">throttled saves, at most every 30 s</text>

  <!-- force-save flags -->
  <g>
    <line x1="390" y1="110" x2="390" y2="200" stroke="#c96b62" stroke-width="3"/>
    <path d="M 390 110 L 440 122 L 390 134 Z" fill="#c96b62"/>
    <text x="390" y="230" text-anchor="middle" font-size="13" fill="#3d3a4a" font-weight="600">next question</text>

    <line x1="630" y1="110" x2="630" y2="200" stroke="#c96b62" stroke-width="3"/>
    <path d="M 630 110 L 680 122 L 630 134 Z" fill="#c96b62"/>
    <text x="630" y="230" text-anchor="middle" font-size="13" fill="#3d3a4a" font-weight="600">section ends</text>

    <line x1="900" y1="110" x2="900" y2="200" stroke="#c96b62" stroke-width="3"/>
    <path d="M 900 110 L 950 122 L 900 134 Z" fill="#c96b62"/>
    <text x="900" y="230" text-anchor="middle" font-size="13" fill="#3d3a4a" font-weight="600">call ends</text>
  </g>
  <text x="390" y="86" font-size="14" fill="#c96b62" font-weight="600">force save: skips the throttle at every point of no return</text>

  <text x="80" y="300" font-size="14" fill="#3d3a4a">after these moments the old data stops flowing.</text>
  <text x="80" y="324" font-size="14" fill="#3d3a4a">a crash right after the switch loses the last few seconds forever, so save them now.</text>
</svg>
