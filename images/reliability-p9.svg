<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="1100" height="480" fill="#faf7f2"/>

  <!-- symptom -->
  <rect x="70" y="190" width="270" height="100" rx="14" fill="#f9dcc4" stroke="#3d3a4a" stroke-opacity="0.3"/>
  <text x="205" y="232" text-anchor="middle" font-size="17" font-weight="600" fill="#3d3a4a">"the agent dropped</text>
  <text x="205" y="256" text-anchor="middle" font-size="17" font-weight="600" fill="#3d3a4a">mid-call"</text>

  <!-- causes -->
  <g fill="#efeae3" stroke="#3d3a4a" stroke-opacity="0.2">
    <rect x="560" y="40"  width="230" height="42" rx="10"/>
    <rect x="560" y="94"  width="230" height="42" rx="10"/>
    <rect x="560" y="148" width="230" height="42" rx="10"/>
    <rect x="560" y="202" width="230" height="42" rx="10"/>
    <rect x="560" y="256" width="230" height="42" rx="10"/>
    <rect x="560" y="310" width="230" height="42" rx="10"/>
    <rect x="560" y="364" width="230" height="42" rx="10"/>
    <rect x="560" y="418" width="230" height="42" rx="10"/>
  </g>
  <g font-size="14" fill="#3d3a4a">
    <text x="675" y="67"  text-anchor="middle">deploy drain killed the worker</text>
    <text x="675" y="121" text-anchor="middle">cloud node preempted</text>
    <text x="675" y="175" text-anchor="middle">platform bug swept the room</text>
    <text x="675" y="229" text-anchor="middle">blocked event loop, watchdog kill</text>
    <text x="675" y="283" text-anchor="middle">avatar vendor died mid-call</text>
    <text x="675" y="337" text-anchor="middle">dev worker stole the prod job</text>
    <text x="675" y="391" text-anchor="middle">our own boot API timed out</text>
    <text x="675" y="445" text-anchor="middle">user's VPN blocked the media</text>
  </g>

  <!-- fan lines -->
  <g stroke="#a49e94" stroke-width="1.6">
    <line x1="340" y1="215" x2="558" y2="61"/>
    <line x1="340" y1="225" x2="558" y2="115"/>
    <line x1="340" y1="235" x2="558" y2="169"/>
    <line x1="340" y1="245" x2="558" y2="223"/>
    <line x1="340" y1="255" x2="558" y2="277"/>
    <line x1="340" y1="265" x2="558" y2="331"/>
    <line x1="340" y1="275" x2="558" y2="385"/>
    <line x1="340" y1="285" x2="558" y2="439"/>
  </g>

  <text x="860" y="230" font-size="15" font-weight="600" fill="#c96b62">one symptom,</text>
  <text x="860" y="254" font-size="15" font-weight="600" fill="#c96b62">eight root causes.</text>
  <text x="860" y="284" font-size="14" fill="#3d3a4a">misattributing one</text>
  <text x="860" y="306" font-size="14" fill="#3d3a4a">for another cost us</text>
  <text x="860" y="328" font-size="14" fill="#3d3a4a">weeks, each time.</text>
</svg>
