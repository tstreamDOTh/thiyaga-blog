<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="1100" height="400" fill="#faf7f2"/>

  <!-- slider -->
  <line x1="180" y1="140" x2="920" y2="140" stroke="#3d3a4a" stroke-width="4" stroke-linecap="round"/>
  <text x="160" y="146" text-anchor="end" font-size="15" font-weight="600" fill="#c96b62">cuts users off</text>
  <text x="940" y="146" font-size="15" font-weight="600" fill="#c96b62">feels sluggish</text>

  <path d="M 548 108 L 572 108 L 560 134 Z" fill="#3d3a4a"/>
  <text x="560" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#3d3a4a">every knob sits between two failure modes</text>
  <text x="560" y="172" text-anchor="middle" font-size="13" fill="#6b6577">endpointing, VAD threshold, noise cancellation: move one, retune its neighbors</text>

  <!-- eval suite -->
  <text x="180" y="250" font-size="14" font-weight="600" fill="#3d3a4a">the tuning set: every recording that ever misbehaved</text>
  <g fill="#8f86c9">
    <g transform="translate(180,280)">
      <rect x="0" y="10" width="8" height="22" rx="4"/><rect x="14" y="0" width="8" height="42" rx="4"/><rect x="28" y="14" width="8" height="14" rx="4"/>
    </g>
    <g transform="translate(260,280)">
      <rect x="0" y="6" width="8" height="30" rx="4"/><rect x="14" y="16" width="8" height="10" rx="4"/><rect x="28" y="2" width="8" height="38" rx="4"/>
    </g>
    <g transform="translate(340,280)">
      <rect x="0" y="14" width="8" height="14" rx="4"/><rect x="14" y="4" width="8" height="34" rx="4"/><rect x="28" y="10" width="8" height="22" rx="4"/>
    </g>
    <g transform="translate(420,280)">
      <rect x="0" y="0" width="8" height="42" rx="4"/><rect x="14" y="12" width="8" height="18" rx="4"/><rect x="28" y="6" width="8" height="30" rx="4"/>
    </g>
  </g>
  <text x="500" y="306" font-size="13" fill="#6b6577">the Arabic speaker who got cut off, the "sí" that was never heard,</text>
  <text x="500" y="326" font-size="13" fill="#6b6577">the kitchen with a crying kid. re-run them all on every knob change.</text>
</svg>
