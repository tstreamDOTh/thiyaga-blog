<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="1100" height="340" fill="#faf7f2"/>

  <text x="80" y="70" font-size="15" font-weight="600" fill="#3d3a4a">the supervisor pings your process every 2.5 s</text>

  <line x1="80" y1="160" x2="1020" y2="160" stroke="#3d3a4a" stroke-width="4"/>

  <!-- answered pings -->
  <g fill="#8f86c9">
    <circle cx="130" cy="160" r="8"/>
    <circle cx="190" cy="160" r="8"/>
    <circle cx="250" cy="160" r="8"/>
    <circle cx="310" cy="160" r="8"/>
    <circle cx="370" cy="160" r="8"/>
  </g>
  <text x="250" y="130" text-anchor="middle" font-size="13" fill="#8f86c9" font-weight="600">answered</text>

  <!-- blocking bar -->
  <rect x="410" y="144" width="420" height="32" rx="6" fill="#3d3a4a"/>
  <text x="620" y="166" text-anchor="middle" font-size="14" fill="#faf7f2" font-weight="600">one synchronous call inside an async function (33 s)</text>

  <!-- missed pings -->
  <g fill="none" stroke="#c96b62" stroke-width="2.5">
    <circle cx="450" cy="210" r="8"/>
    <circle cx="510" cy="210" r="8"/>
    <circle cx="570" cy="210" r="8"/>
    <circle cx="630" cy="210" r="8"/>
    <circle cx="690" cy="210" r="8"/>
    <circle cx="750" cy="210" r="8"/>
  </g>
  <text x="600" y="246" text-anchor="middle" font-size="13" fill="#c96b62" font-weight="600">pings unanswered: the loop is frozen</text>

  <!-- kill -->
  <g stroke="#c96b62" stroke-width="5" stroke-linecap="round">
    <line x1="856" y1="138" x2="892" y2="182"/>
    <line x1="892" y1="138" x2="856" y2="182"/>
  </g>
  <text x="874" y="212" text-anchor="middle" font-size="14" fill="#c96b62" font-weight="600">killed as unresponsive</text>
  <text x="874" y="232" text-anchor="middle" font-size="13" fill="#c96b62">user hears the agent vanish</text>

  <text x="80" y="300" font-size="13" fill="#8a8494">one blocking line anywhere in the pipeline freezes everything: audio, heartbeats, the works</text>
</svg>
