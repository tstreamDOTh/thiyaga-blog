<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice" class="anim-cover">
<style>
  .croute * { transform-box: fill-box; transform-origin: center; }
  @media (prefers-reduced-motion: reduce) { .croute * { animation: none !important; } }
  :is(.post-entry,.home-tile,.entry-cover):hover .croute .win { animation: croute-race 0.7s ease-out 1; }
  @keyframes croute-race { 0% { stroke-dashoffset: 700; } 100% { stroke-dashoffset: 0; } }
  :is(.post-entry,.home-tile,.entry-cover):hover .croute .dot { animation: croute-land 0.7s ease-out 1; }
  @keyframes croute-land { 0%,70% { transform: scale(0); } 85% { transform: scale(1.3); } 100% { transform: scale(1); } }
</style>
<g class="croute">
<rect width="1200" height="630" fill="#A8EBC9"/>
<line x1="270" y1="236" x2="530" y2="236" stroke="#3a3a3a" stroke-width="10" opacity="0.4"/>
<line x1="270" y1="394" x2="530" y2="394" stroke="#3a3a3a" stroke-width="10" opacity="0.4"/>
<polygon points="640,242 640,388 770,315" fill="none" stroke="#3a3a3a" stroke-width="10" stroke-linejoin="round"/>
<line class="win" x1="270" y1="315" x2="950" y2="315" stroke="#3a3a3a" stroke-width="10" stroke-dasharray="700" stroke-dashoffset="0"/>
<circle class="dot" cx="950" cy="315" r="22" fill="#3a3a3a"/>
</g>
</svg>
