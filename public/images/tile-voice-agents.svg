<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice" class="anim-cover">
<style>
  .tvoice * { transform-box: fill-box; transform-origin: center; }
  @media (prefers-reduced-motion: reduce) { .tvoice * { animation: none !important; } }
  :is(.post-entry,.home-tile,.entry-cover):hover .tvoice .core { animation: tvoice-core 0.6s ease-in-out 1; }
  @keyframes tvoice-core { 0%,100% { transform: scale(1); } 40% { transform: scale(1.12); } }
  :is(.post-entry,.home-tile,.entry-cover):hover .tvoice .ring { animation: tvoice-ring 0.7s ease-out 1; }
  @keyframes tvoice-ring { 0% { transform: scale(0.8); opacity: 0.6; } 100% { transform: scale(1.6); opacity: 0; } }
</style>
<g class="tvoice">
<rect width="1200" height="400" fill="#8FC9FF"/>
<circle class="ring" cx="600" cy="200" r="92" fill="none" stroke="#3a3a3a" stroke-width="6" opacity="0.3"/>
<circle class="core" cx="600" cy="200" r="60" fill="#3a3a3a"/>
</g>
</svg>
