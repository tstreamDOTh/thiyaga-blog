<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="1200" height="560" fill="#faf7f2"/>
  <text x="600" y="48" text-anchor="middle" font-size="24" font-weight="600" fill="#3d3a4a">The latency budget</text>
  <text x="600" y="74" text-anchor="middle" font-size="15" fill="#8a8494">time from the user going quiet to the agent's first audio (illustrative numbers)</text>

  <!-- scale: 0.2 px per ms, origin x=90 -->
  <!-- Sequential bar: endpoint 500, STT 300, LLM full 2400, TTS full 1500 = 4700ms -->
  <text x="90" y="140" font-size="16" font-weight="600" fill="#3d3a4a">Naive: each stage waits for the previous one to finish</text>

  <rect x="90"  y="158" width="100" height="52" fill="#dce8df" stroke="#3d3a4a" stroke-opacity="0.2"/>
  <rect x="190" y="158" width="60"  height="52" fill="#d6e4f0" stroke="#3d3a4a" stroke-opacity="0.2"/>
  <rect x="250" y="158" width="480" height="52" fill="#e4dcf1" stroke="#3d3a4a" stroke-opacity="0.2"/>
  <rect x="730" y="158" width="300" height="52" fill="#f9dcc4" stroke="#3d3a4a" stroke-opacity="0.2"/>

  <text x="140" y="189" text-anchor="middle" font-size="13" fill="#3d3a4a">endpoint</text>
  <text x="220" y="189" text-anchor="middle" font-size="13" fill="#3d3a4a">STT</text>
  <text x="490" y="182" text-anchor="middle" font-size="13" fill="#3d3a4a">LLM: full response</text>
  <text x="490" y="200" text-anchor="middle" font-size="12" fill="#6b6577">2,400 ms</text>
  <text x="880" y="182" text-anchor="middle" font-size="13" fill="#3d3a4a">TTS: full clip</text>
  <text x="880" y="200" text-anchor="middle" font-size="12" fill="#6b6577">1,500 ms</text>
  <text x="1042" y="189" font-size="15" font-weight="600" fill="#c96b62">~4,700 ms</text>

  <!-- Streamed bar: endpoint 500, STT finalize 100, LLM first tokens 350, TTS first chunk 150, transport 50 = 1150 -->
  <text x="90" y="290" font-size="16" font-weight="600" fill="#3d3a4a">Streamed: every stage emits as soon as it has something</text>

  <rect x="90"  y="308" width="100" height="52" fill="#dce8df" stroke="#3d3a4a" stroke-opacity="0.2"/>
  <rect x="190" y="308" width="20"  height="52" fill="#d6e4f0" stroke="#3d3a4a" stroke-opacity="0.2"/>
  <rect x="210" y="308" width="70"  height="52" fill="#e4dcf1" stroke="#3d3a4a" stroke-opacity="0.2"/>
  <rect x="280" y="308" width="30"  height="52" fill="#f9dcc4" stroke="#3d3a4a" stroke-opacity="0.2"/>
  <rect x="310" y="308" width="10"  height="52" fill="#efeae3" stroke="#3d3a4a" stroke-opacity="0.2"/>

  <text x="140" y="339" text-anchor="middle" font-size="13" fill="#3d3a4a">endpoint</text>
  <text x="332" y="339" font-size="15" font-weight="600" fill="#3d3a4a">~1,150 ms</text>

  <!-- callout lines for streamed segments -->
  <line x1="200" y1="362" x2="200" y2="400" stroke="#a49e94" stroke-width="1.2"/>
  <text x="200" y="418" text-anchor="middle" font-size="12" fill="#6b6577">STT finalize 100</text>
  <line x1="245" y1="362" x2="245" y2="440" stroke="#a49e94" stroke-width="1.2"/>
  <text x="245" y="458" text-anchor="middle" font-size="12" fill="#6b6577">LLM first sentence 350</text>
  <line x1="295" y1="362" x2="295" y2="480" stroke="#a49e94" stroke-width="1.2"/>
  <text x="295" y="498" text-anchor="middle" font-size="12" fill="#6b6577">TTS first chunk 150 + transport 50</text>

  <!-- Endpoint annotation -->
  <line x1="140" y1="362" x2="140" y2="524" stroke="#a49e94" stroke-width="1.2"/>
  <text x="90" y="542" font-size="12" fill="#6b6577">endpointing wait 500: the biggest slice you control</text>

  <!-- Budget line at 800ms streamed-bar frame: x = 90 + 800*0.2 = 250 ... but bars use different framing; draw on streamed bar -->
  <line x1="250" y1="150" x2="250" y2="372" stroke="#c96b62" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="262" y="250" font-size="13" font-weight="600" fill="#c96b62">~800 ms: where a pause starts to feel like a lag</text>
</svg>
