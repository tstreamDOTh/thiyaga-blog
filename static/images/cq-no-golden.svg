<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ng" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a5566"/></marker>
    <marker id="ngr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c96b62"/></marker>
  </defs>
  <rect width="1100" height="340" fill="#faf7f2"/>
  <!-- left: task eval -->
  <text x="80" y="50" font-size="15" font-weight="600" fill="#3d3a4a">a task eval</text>
  <rect x="80" y="80" width="130" height="50" rx="10" fill="#e4dcf1" stroke="#3d3a4a" stroke-opacity="0.2"/>
  <text x="145" y="110" text-anchor="middle" font-size="14" fill="#3d3a4a">input</text>
  <line x1="210" y1="105" x2="270" y2="105" stroke="#5a5566" stroke-width="2" marker-end="url(#ng)"/>
  <rect x="275" y="80" width="130" height="50" rx="10" fill="#efeae3" stroke="#3d3a4a" stroke-opacity="0.2"/>
  <text x="340" y="110" text-anchor="middle" font-size="14" fill="#3d3a4a">output</text>
  <text x="340" y="160" text-anchor="middle" font-size="13" fill="#6b6577">compare to</text>
  <rect x="275" y="175" width="130" height="50" rx="10" fill="#efeae3" stroke="#5a5566" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="340" y="205" text-anchor="middle" font-size="14" fill="#3d3a4a">reference</text>
  <text x="242" y="270" text-anchor="middle" font-size="13" fill="#3d3a4a" font-weight="600">one right answer. diff it.</text>

  <line x1="540" y1="50" x2="540" y2="290" stroke="#3d3a4a" stroke-opacity="0.15" stroke-width="2"/>

  <!-- right: conversation -->
  <text x="600" y="50" font-size="15" font-weight="600" fill="#3d3a4a">a conversation</text>
  <rect x="600" y="115" width="190" height="50" rx="10" fill="#e4dcf1" stroke="#3d3a4a" stroke-opacity="0.2"/>
  <text x="695" y="145" text-anchor="middle" font-size="14" fill="#3d3a4a">"I led the migration"</text>
  <line x1="790" y1="140" x2="850" y2="90" stroke="#5a5566" stroke-width="2" marker-end="url(#ng)"/>
  <line x1="790" y1="140" x2="850" y2="140" stroke="#5a5566" stroke-width="2" marker-end="url(#ng)"/>
  <line x1="790" y1="140" x2="850" y2="190" stroke="#5a5566" stroke-width="2" marker-end="url(#ng)"/>
  <rect x="855" y="65" width="190" height="44" rx="10" fill="#efeae3" stroke="#3d3a4a" stroke-opacity="0.2"/>
  <text x="950" y="92" text-anchor="middle" font-size="13" fill="#3d3a4a">"How big was the team?"</text>
  <rect x="855" y="118" width="190" height="44" rx="10" fill="#efeae3" stroke="#3d3a4a" stroke-opacity="0.2"/>
  <text x="950" y="145" text-anchor="middle" font-size="13" fill="#3d3a4a">"What was the outcome?"</text>
  <rect x="855" y="171" width="190" height="44" rx="10" fill="#efeae3" stroke="#3d3a4a" stroke-opacity="0.2"/>
  <text x="950" y="198" text-anchor="middle" font-size="13" fill="#3d3a4a">"What went wrong?"</text>
  <text x="822" y="270" text-anchor="middle" font-size="13" fill="#c96b62" font-weight="600">three good next questions. nothing to diff against.</text>
</svg>
