<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ru" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a5566"/></marker>
  </defs>
  <rect width="1100" height="400" fill="#faf7f2"/>
  <!-- one rule -->
  <text x="70" y="50" font-size="15" font-weight="600" fill="#3d3a4a">one rule</text>
  <rect x="70" y="70" width="250" height="150" rx="10" fill="#e4dcf1" stroke="#3d3a4a" stroke-opacity="0.2"/>
  <g font-size="13" fill="#3d3a4a">
    <text x="90" y="100"><tspan fill="#6b6577">id</tspan>        G307</text>
    <text x="90" y="124"><tspan fill="#6b6577">text</tspan>     "Ask one question per turn."</text>
    <text x="90" y="148"><tspan fill="#6b6577">version</tspan>  2026-08-12</text>
    <text x="90" y="172"><tspan fill="#6b6577">severity</tspan> medium</text>
    <text x="90" y="196"><tspan fill="#6b6577">safety</tspan>   no</text>
  </g>
  <!-- group -->
  <line x1="320" y1="145" x2="380" y2="145" stroke="#5a5566" stroke-width="2" marker-end="url(#ru)"/>
  <text x="385" y="50" font-size="15" font-weight="600" fill="#3d3a4a">grouped by moment</text>
  <g font-size="13" fill="#3d3a4a">
    <rect x="385" y="70" width="190" height="30" rx="8" fill="#efeae3" stroke="#3d3a4a" stroke-opacity="0.2"/><text x="480" y="90" text-anchor="middle">opening</text>
    <rect x="385" y="108" width="190" height="30" rx="8" fill="#f9dcc4" stroke="#3d3a4a" stroke-opacity="0.2"/><text x="480" y="128" text-anchor="middle">asking</text>
    <rect x="385" y="146" width="190" height="30" rx="8" fill="#efeae3" stroke="#3d3a4a" stroke-opacity="0.2"/><text x="480" y="166" text-anchor="middle">acknowledging</text>
    <rect x="385" y="184" width="190" height="30" rx="8" fill="#efeae3" stroke="#3d3a4a" stroke-opacity="0.2"/><text x="480" y="204" text-anchor="middle">boundaries</text>
    <rect x="385" y="222" width="190" height="30" rx="8" fill="#efeae3" stroke="#3d3a4a" stroke-opacity="0.2"/><text x="480" y="242" text-anchor="middle">closing</text>
    <text x="480" y="275" text-anchor="middle" font-size="12" fill="#6b6577">+ phase-specific groups</text>
  </g>
  <!-- judge -->
  <line x1="575" y1="123" x2="635" y2="123" stroke="#5a5566" stroke-width="2" marker-end="url(#ru)"/>
  <text x="640" y="50" font-size="15" font-weight="600" fill="#3d3a4a">one judge call per group</text>
  <rect x="640" y="70" width="150" height="110" rx="10" fill="#f9dcc4" stroke="#3d3a4a" stroke-opacity="0.2"/>
  <text x="715" y="105" text-anchor="middle" font-size="14" fill="#3d3a4a">judge</text>
  <text x="715" y="128" text-anchor="middle" font-size="12" fill="#6b6577">rules of the group</text>
  <text x="715" y="146" text-anchor="middle" font-size="12" fill="#6b6577">+ transcript</text>
  <text x="715" y="164" text-anchor="middle" font-size="12" fill="#6b6577">agent turns only</text>
  <!-- verdict -->
  <line x1="790" y1="123" x2="850" y2="123" stroke="#5a5566" stroke-width="2" marker-end="url(#ru)"/>
  <text x="855" y="50" font-size="15" font-weight="600" fill="#3d3a4a">verdict per rule</text>
  <rect x="855" y="70" width="200" height="150" rx="10" fill="#efeae3" stroke="#3d3a4a" stroke-opacity="0.2"/>
  <g font-size="13" fill="#3d3a4a">
    <text x="875" y="100"><tspan fill="#6b6577">G307</tspan>  followed: no</text>
    <text x="875" y="128" fill="#c96b62">turn 14 · medium</text>
    <text x="875" y="150" font-size="12" fill="#6b6577">"asked two questions</text>
    <text x="875" y="167" font-size="12" fill="#6b6577"> in one turn"</text>
    <text x="875" y="200" font-size="12" fill="#6b6577">rule version attached</text>
  </g>
  <text x="550" y="350" text-anchor="middle" font-size="13" fill="#6b6577">the rules are the metric. edit a rule, bump its version, and old results keep their meaning.</text>
</svg>
