<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice" class="anim-cover">
<style>
  .ccost * { transform-box: fill-box; transform-origin: center; }
  @media (prefers-reduced-motion: reduce) { .ccost * { animation: none !important; } }
  :is(.post-entry,.home-tile,.entry-cover):hover .ccost .tok { animation: ccost-in 0.7s ease-in 1; }
  @keyframes ccost-in { 0% { transform: translate(0,0); opacity: 1; } 100% { transform: translate(var(--dx),var(--dy)); opacity: 0; } }
  :is(.post-entry,.home-tile,.entry-cover):hover .ccost .box { animation: ccost-absorb 0.7s ease-out 1; }
  @keyframes ccost-absorb { 0%,60% { transform: scale(1); } 80% { transform: scale(1.12); } 100% { transform: scale(1); } }
</style>
<g class="ccost">
<rect width="1200" height="630" fill="#f7dfe2"/>
<circle class="tok" cx="330" cy="240" r="16" fill="#3a3a3a" style="--dx:430px;--dy:75px;animation-delay:0.00s"/>
<circle class="tok" cx="415" cy="214" r="16" fill="#3a3a3a" style="--dx:345px;--dy:101px;animation-delay:0.05s"/>
<circle class="tok" cx="475" cy="237" r="16" fill="#3a3a3a" style="--dx:285px;--dy:78px;animation-delay:0.10s"/>
<circle class="tok" cx="330" cy="297" r="16" fill="#3a3a3a" style="--dx:430px;--dy:18px;animation-delay:0.15s"/>
<circle class="tok" cx="398" cy="297" r="16" fill="#3a3a3a" style="--dx:362px;--dy:18px;animation-delay:0.00s"/>
<circle class="tok" cx="440" cy="284" r="16" fill="#3a3a3a" style="--dx:320px;--dy:31px;animation-delay:0.05s"/>
<circle class="tok" cx="320" cy="350" r="16" fill="#3a3a3a" style="--dx:440px;--dy:-35px;animation-delay:0.10s"/>
<circle class="tok" cx="412" cy="358" r="16" fill="#3a3a3a" style="--dx:348px;--dy:-43px;animation-delay:0.15s"/>
<circle class="tok" cx="455" cy="370" r="16" fill="#3a3a3a" style="--dx:305px;--dy:-55px;animation-delay:0.00s"/>
<circle class="tok" cx="365" cy="420" r="16" fill="#3a3a3a" style="--dx:395px;--dy:-105px;animation-delay:0.05s"/>
<polyline points="540,210 760,315 540,420" fill="none" stroke="#3a3a3a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="box" x="785" y="265" width="100" height="100" fill="#3a3a3a"/>
</g>
</svg>
