<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5566"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c96b62"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a49e94"/>
    </marker>
  </defs>

  <rect width="1200" height="660" fill="#faf7f2"/>
  <text x="600" y="48" text-anchor="middle" font-size="24" font-weight="600" fill="#3d3a4a">The agentic voice pipeline</text>
  <text x="600" y="74" text-anchor="middle" font-size="15" fill="#8a8494">audio flows in a loop, not request and response</text>

  <!-- User -->
  <rect x="40" y="270" width="140" height="110" rx="14" fill="#f9dcc4" stroke="#3d3a4a" stroke-opacity="0.25"/>
  <text x="110" y="315" text-anchor="middle" font-size="18" font-weight="600" fill="#3d3a4a">User</text>
  <text x="110" y="340" text-anchor="middle" font-size="13" fill="#6b6577">mic + speaker</text>

  <!-- Transport -->
  <rect x="235" y="270" width="150" height="110" rx="14" fill="#efeae3" stroke="#3d3a4a" stroke-opacity="0.25"/>
  <text x="310" y="313" text-anchor="middle" font-size="17" font-weight="600" fill="#3d3a4a">Transport</text>
  <text x="310" y="336" text-anchor="middle" font-size="13" fill="#6b6577">WebRTC</text>
  <text x="310" y="354" text-anchor="middle" font-size="13" fill="#6b6577">jitter, echo, loss</text>

  <!-- User <-> Transport -->
  <line x1="180" y1="310" x2="233" y2="310" stroke="#5a5566" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="233" y1="345" x2="182" y2="345" stroke="#5a5566" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Top row: hearing chain -->
  <rect x="440" y="130" width="130" height="92" rx="14" fill="#dce8df" stroke="#3d3a4a" stroke-opacity="0.25"/>
  <text x="505" y="168" text-anchor="middle" font-size="17" font-weight="600" fill="#3d3a4a">VAD</text>
  <text x="505" y="192" text-anchor="middle" font-size="13" fill="#6b6577">is anyone talking?</text>

  <rect x="610" y="130" width="160" height="92" rx="14" fill="#dce8df" stroke="#3d3a4a" stroke-opacity="0.25"/>
  <text x="690" y="168" text-anchor="middle" font-size="17" font-weight="600" fill="#3d3a4a">Turn detection</text>
  <text x="690" y="192" text-anchor="middle" font-size="13" fill="#6b6577">are they done?</text>

  <rect x="810" y="130" width="120" height="92" rx="14" fill="#d6e4f0" stroke="#3d3a4a" stroke-opacity="0.25"/>
  <text x="870" y="168" text-anchor="middle" font-size="17" font-weight="600" fill="#3d3a4a">STT</text>
  <text x="870" y="192" text-anchor="middle" font-size="13" fill="#6b6577">audio → text</text>

  <!-- Agent core -->
  <rect x="975" y="180" width="185" height="280" rx="16" fill="#e4dcf1" stroke="#3d3a4a" stroke-opacity="0.3"/>
  <text x="1067" y="216" text-anchor="middle" font-size="18" font-weight="600" fill="#3d3a4a">Agent core</text>
  <rect x="995" y="236" width="145" height="44" rx="10" fill="#faf7f2" stroke="#3d3a4a" stroke-opacity="0.2"/>
  <text x="1067" y="264" text-anchor="middle" font-size="14" fill="#3d3a4a">LLM</text>
  <rect x="995" y="292" width="145" height="44" rx="10" fill="#faf7f2" stroke="#3d3a4a" stroke-opacity="0.2"/>
  <text x="1067" y="320" text-anchor="middle" font-size="14" fill="#3d3a4a">Tools</text>
  <rect x="995" y="348" width="145" height="44" rx="10" fill="#faf7f2" stroke="#3d3a4a" stroke-opacity="0.2"/>
  <text x="1067" y="376" text-anchor="middle" font-size="14" fill="#3d3a4a">State + memory</text>
  <text x="1067" y="430" text-anchor="middle" font-size="12" fill="#8a8494">the agentic part</text>

  <!-- Bottom row: TTS -->
  <rect x="610" y="420" width="160" height="92" rx="14" fill="#d6e4f0" stroke="#3d3a4a" stroke-opacity="0.25"/>
  <text x="690" y="458" text-anchor="middle" font-size="17" font-weight="600" fill="#3d3a4a">TTS</text>
  <text x="690" y="482" text-anchor="middle" font-size="13" fill="#6b6577">text → audio</text>

  <!-- Flow arrows -->
  <!-- Transport up to VAD -->
  <path d="M 385 290 C 410 250, 410 210, 438 185" fill="none" stroke="#5a5566" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="382" y="228" font-size="12" fill="#8a8494">uplink audio</text>
  <!-- VAD -> Turn -> STT -->
  <line x1="570" y1="176" x2="608" y2="176" stroke="#5a5566" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="176" x2="808" y2="176" stroke="#5a5566" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- STT -> Agent -->
  <path d="M 930 176 C 960 176, 960 200, 985 218" fill="none" stroke="#5a5566" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="928" y="156" font-size="12" fill="#8a8494">transcript</text>
  <!-- Agent -> TTS -->
  <path d="M 975 440 C 900 466, 840 466, 772 466" fill="none" stroke="#5a5566" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="850" y="448" font-size="12" fill="#8a8494">reply tokens</text>
  <!-- TTS -> Transport -->
  <path d="M 608 466 C 480 466, 420 430, 340 382" fill="none" stroke="#5a5566" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="452" font-size="12" fill="#8a8494">downlink audio</text>

  <!-- Interruption path -->
  <path d="M 505 224 C 505 330, 540 400, 606 438" fill="none" stroke="#c96b62" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowRed)"/>
  <text x="470" y="330" font-size="13" fill="#c96b62" font-weight="600">barge-in:</text>
  <text x="470" y="348" font-size="13" fill="#c96b62">stop speaking,</text>
  <text x="470" y="366" font-size="13" fill="#c96b62">flush the audio</text>

  <!-- Sidecars -->
  <text x="130" y="500" font-size="14" font-weight="600" fill="#8a8494">Sidecars</text>
  <rect x="40" y="516" width="118" height="56" rx="12" fill="#efeae3" stroke="#3d3a4a" stroke-opacity="0.18" stroke-dasharray="4 3"/>
  <text x="99" y="549" text-anchor="middle" font-size="13" fill="#6b6577">Recording</text>
  <rect x="170" y="516" width="118" height="56" rx="12" fill="#efeae3" stroke="#3d3a4a" stroke-opacity="0.18" stroke-dasharray="4 3"/>
  <text x="229" y="549" text-anchor="middle" font-size="13" fill="#6b6577">Metrics</text>
  <rect x="300" y="516" width="118" height="56" rx="12" fill="#efeae3" stroke="#3d3a4a" stroke-opacity="0.18" stroke-dasharray="4 3"/>
  <text x="359" y="549" text-anchor="middle" font-size="13" fill="#6b6577">Fallbacks</text>
  <line x1="229" y1="514" x2="300" y2="384" stroke="#a49e94" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowGrey)"/>
  <text x="40" y="600" font-size="12" fill="#8a8494">observe every stage; never in the audio path</text>
</svg>
